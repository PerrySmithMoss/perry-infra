# Preserve local administration and existing applications. BulkBets roles may
# connect only to their own database, with TLS required for application traffic.
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
hostssl bulk_bets bulkbets_runtime,bulkbets 0.0.0.0/0 scram-sha-256
hostssl bulk_bets bulkbets_runtime,bulkbets ::/0 scram-sha-256
host all bulkbets_runtime,bulkbets 0.0.0.0/0 reject
host all bulkbets_runtime,bulkbets ::/0 reject
host all all 0.0.0.0/0 scram-sha-256
host all all ::/0 scram-sha-256
