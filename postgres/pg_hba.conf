# Preserve local administration. Application network connections are restricted
# to each role's own database; BulkBets and Im Listening require TLS.
# The collector may use only postgres, over its own overlay and verified TLS.
# Keep these rejections before local trust and administrator catch-all rules.
hostssl postgres netdata_monitor 10.42.20.0/24 scram-sha-256
local all netdata_monitor reject
host all netdata_monitor 0.0.0.0/0 reject
host all netdata_monitor ::/0 reject
# Legacy Prisma clients retain their existing transport on encrypted overlays.
# Im Listening already verifies the server CA and must continue using TLS.
host chinwag chinwag_app 10.42.31.0/24 scram-sha-256
hostssl im_listening im_listening 10.42.35.0/24 scram-sha-256
host vita_track vita_track_app 10.42.37.0/24 scram-sha-256
host all chinwag_app,im_listening,vita_track_app 0.0.0.0/0 reject
host all chinwag_app,im_listening,vita_track_app ::/0 reject
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
hostssl bulk_bets bulkbets_runtime,bulkbets 0.0.0.0/0 scram-sha-256
hostssl bulk_bets bulkbets_runtime,bulkbets ::/0 scram-sha-256
host all bulkbets_runtime,bulkbets 0.0.0.0/0 reject
host all bulkbets_runtime,bulkbets ::/0 reject
host all all 0.0.0.0/0 scram-sha-256
host all all ::/0 scram-sha-256
