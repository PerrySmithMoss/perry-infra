name: Infrastructure image security
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: deploy/portfolio/go.mod
          cache: false
      - name: Validate host monitoring configuration and startup guard
        run: |
          for script in monitoring/install.sh monitoring/check-config.sh monitoring/verify.sh; do sh -n "$script"; done
          bash -n monitoring/claim.sh
          go -C monitoring test -race ./...
          go -C monitoring vet ./...
          shellcheck monitoring/*.sh
      - name: Check Docker API restrictions
        run: sh docker-proxy/test.sh
      - name: Verify shared Redis ACLs and persistence with deployed app clients
        run: |
          go -C redis test -race ./...
          go -C redis vet ./...
          sh -n redis/test.sh
          shellcheck redis/*.sh
          sh redis/test.sh
      - name: Check restricted infrastructure deployment boundary
        run: |
          go -C deploy/infrastructure test -race ./...
          go -C deploy/infrastructure vet ./...
          sh -n deploy/install.sh
      - name: Check private metrics tooling and relay boundaries
        run: |
          METRICS_DOCKER_TEST=1 go -C monitoring/collectors test -race ./...
          go -C monitoring/collectors vet ./...
      - name: Test portfolio release policy
        run: |
          go -C deploy/portfolio test -race ./...
          go -C deploy/portfolio vet ./...
          sh -n deploy/portfolio/install.sh
      - name: Check scoped application roles on disposable PostgreSQL
        run: |
          set -eu
          fixture=$(docker run -d -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD/postgres:/tests:ro" postgres:17.11-bookworm)
          trap 'docker rm -f "$fixture" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$fixture" pg_isready -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$fixture" pg_isready -h 127.0.0.1 >/dev/null
          docker exec -e PGUSER=postgres "$fixture" sh /tests/test-legacy-app-role.sh
      - name: Warn before database certificates expire
        run: sh postgres/check-certificates.sh
      - name: Scan every runtime image
        run: |
          set -eu
          mkdir reports
          scanner=aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          for image in $(awk '/    image:/{print $2}' docker-compose.stack.yaml); do
            name=${image##*/}
            name=${name%%[:@]*}
            docker run --rm -v "$PWD/reports:/reports" -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --severity HIGH,CRITICAL --format json --output "/reports/$name.json" "$image"
            case "$image" in
              postgres:*)
                # Full report retained above. Debian-unfixed libraries and the
                # non-network gosu helper are tracked in the remediation record.
                docker run --rm -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --pkg-types os --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image" ;;
              ghcr.io/perrysmithmoss/perry-infra-postgres@sha256:*)
                # The reviewed candidate excludes gosu. Keep the full report
                # and fail on any fixable high or critical package finding.
                docker run --rm -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image" ;;
              *) docker run --rm -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image" ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infrastructure-vulnerabilities
          path: reports
