name: Infrastructure image security
on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check Docker API restrictions
        run: sh docker-proxy/test.sh
      - name: Check restricted deployment boundary
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: deploy/portfolio/go.mod
          cache: false
      - name: Test portfolio release policy
        run: |
          go -C deploy/portfolio test -race ./...
          go -C deploy/portfolio vet ./...
          sh -n deploy/portfolio/install.sh
      - name: Check scoped application roles on disposable PostgreSQL
        run: |
          set -eu
          fixture=$(docker run -d -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$PWD/postgres:/tests:ro" postgres:17.11-bookworm)
          trap 'docker rm -f "$fixture" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$fixture" pg_isready -h 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$fixture" pg_isready -h 127.0.0.1 >/dev/null
          docker exec -e PGUSER=postgres "$fixture" sh /tests/test-legacy-app-role.sh
      - name: Warn before database certificates expire
        run: sh postgres/check-certificates.sh
      - name: Scan every runtime image
        run: |
          set -eu
          mkdir reports
          scanner=aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          for image in $(awk '/    image:/{print $2}' docker-compose.stack.yaml); do
            name=${image%%:*}
            docker run --rm -v "$PWD/reports:/reports" -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --severity HIGH,CRITICAL --format json --output "/reports/$name.json" "$image"
            case "$name" in
              postgres)
                # Full report retained above. Debian-unfixed libraries and the
                # non-network gosu helper are tracked in the remediation record.
                docker run --rm -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --pkg-types os --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$image" ;;
              *) docker run --rm -v trivy-cache:/root/.cache/trivy "$scanner" image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$image" ;;
            esac
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: infrastructure-vulnerabilities
          path: reports
