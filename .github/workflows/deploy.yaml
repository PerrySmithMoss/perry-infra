name: Deploy to VPS
on:
  push:
    branches: [main]
    paths: [".github/**", "docker-compose.stack.yaml", "postgres/**", "docker-proxy/**", "deploy/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perry-infra-production
  cancel-in-progress: false
jobs:
  security:
    uses: ./.github/workflows/security.yaml
  deploy:
    needs: [security]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - name: Check Docker API restrictions
        run: sh docker-proxy/test.sh
      - name: Configure verified SSH transport
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          INFRA_RELEASE_KEY: ${{ secrets.INFRA_RELEASE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          : "${VPS_IP:?Missing VPS_IP}"
          : "${INFRA_RELEASE_KEY:?Missing deployment key}"
          : "${VPS_KNOWN_HOSTS:?Missing verified VPS host keys}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$INFRA_RELEASE_KEY" > "$RUNNER_TEMP/infra-key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/infra-hosts"
          cat > "$HOME/.ssh/config" <<CONFIG
          Host infra-vps
            HostName $VPS_IP
            User infra-release
            IdentityFile $RUNNER_TEMP/infra-key
            UserKnownHostsFile $RUNNER_TEMP/infra-hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          CONFIG
      - name: Deploy administrator-reviewed infrastructure snapshot
        run: |
          # Compute the fingerprint locally; the broker independently verifies its snapshot.
          # shellcheck disable=SC2029
          ssh infra-vps "infrastructure $(python3 -B deploy/fingerprint.py)"
      - name: Remove runner credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/infra-key" "$RUNNER_TEMP/infra-hosts" "$HOME/.ssh/config"
