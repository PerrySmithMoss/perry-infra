global
    maxconn 128
    nbthread 2

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker_readonly
    bind :2375
    acl readonly method GET HEAD
    acl discovery path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|services|tasks|networks|nodes)(/[A-Za-z0-9_-]+)?$
    http-request deny deny_status 403 unless readonly discovery
    default_backend docker_engine

backend docker_engine
    server docker /var/run/docker.sock
