bind 0.0.0.0
protected-mode yes
port 6379
daemonize no
logfile ""
dir /data
aclfile /run/secrets/redis_users

# Preserve the existing AOF format and data. Never evict authentication state
# to make room for another application's cache. Exhaustion rejects writes.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
save ""
stop-writes-on-bgsave-error yes
maxmemory 64mb
maxmemory-policy noeviction
databases 1

# Bound individual connections as well as the container's overall allowance.
maxclients 128
client-query-buffer-limit 1mb
proto-max-bulk-len 1mb
client-output-buffer-limit normal 1mb 512kb 60
timeout 300
tcp-keepalive 60
