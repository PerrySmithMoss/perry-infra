# Stock PostgreSQL connection/locks/deadlock and Redis rejected-connection rules
# remain enabled. Add a low-traffic-friendly entrypoint 5xx warning.
# A same-name label-scoped template overrides the stock rule only for Chinwag. Do not
# shadow postgres.conf: all other databases and PostgreSQL rules keep defaults.
# Duplicate registrations produced brief 2--2.5% rollback bursts on Chinwag.
template: postgres_db_transactions_rollback_ratio
      on: postgres.db_transactions_ratio
chart labels: database=chinwag
   class: Workload
    type: Database
component: PostgreSQL
  lookup: average -5m unaligned of rollback
   every: 1m
   units: %
    warn: $this > (($status >= $WARNING) ? (5) : (10))
   delay: up 5m down 5m
 summary: PostgreSQL DB chinwag aborted transactions
    info: Five-minute average rollback percentage in chinwag; warn above 10 percent for five minutes and clear at 5 percent or below
      to: dba

template: perry_traefik_5xx
      on: traefik.entrypoint_requests
   class: Errors
    type: Web Server
component: Traefik
  lookup: average -5m unaligned of 5xx
   every: 30s
   units: requests/s
    warn: $this > 0
   delay: up 1m down 5m
 summary: Traefik HTTP 5xx responses
    info: HTTP 5xx responses observed during the last five minutes; inspect service-labelled request charts
      to: webmaster

template: perry_redis_memory
      on: redis.memory
   class: Utilization
    type: Database
component: Redis
    calc: $used * 100 / $max
   every: 30s
   units: %
    warn: $this > 80
    crit: $this > 90
   delay: up 2m down 5m
 summary: Shared Redis memory utilization
    info: Redis maxmemory utilization; noeviction rejects writes at capacity
      to: dba

template: perry_redis_evictions
      on: redis.key_eviction_events
   class: Errors
    type: Database
component: Redis
  lookup: average -1m unaligned of evicted
   every: 30s
   units: keys/s
    crit: $this > 0
   delay: down 5m
 summary: Shared Redis evicted keys
    info: Any eviction violates the shared Redis noeviction policy
      to: dba
