# Native Traefik charts cover entrypoints. This job retains service/code labels
# and duration histograms without collecting process/runtime metrics twice.
jobs:
  - name: traefik_services
    app: traefik_services
    update_every: 5
    autodetection_retry: 30
    url: http://127.0.0.1:18082/metrics
    timeout: 2
    expected_prefix: traefik_service_
    profiles:
      mode: none
    selector:
      allow:
        - traefik_service_requests_total
        - traefik_service_request_duration_seconds*
    max_time_series: 1000
    max_time_series_per_metric: 200
