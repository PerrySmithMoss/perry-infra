global
    maxconn 32
    nbthread 1

defaults
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

# The host directory is root:netdata 0750. Socket modes avoid baking the
# administrator-installed netdata GID into Swarm; traversal controls access.
frontend postgres_socket
    bind /run/perry-metrics/15432.sock mode 666
    default_backend postgres
backend postgres
    server database postgres:5432 check resolvers docker init-addr libc,none

frontend redis_socket
    bind /run/perry-metrics/16379.sock mode 666
    default_backend redis
backend redis
    server cache redis:6379 check resolvers docker init-addr libc,none

frontend traefik_socket
    bind /run/perry-metrics/18082.sock mode 666
    default_backend traefik
backend traefik
    server proxy traefik:8082 check resolvers docker init-addr libc,none
