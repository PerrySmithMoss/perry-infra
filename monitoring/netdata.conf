# Managed by perry-infra/monitoring. No credentials belong in this file.
[web]
    mode = none

[db]
    db = dbengine
    update every = 5
    storage tiers = 2
    dbengine tier 0 retention size = 512MiB
    dbengine tier 0 retention time = 7d
    dbengine tier 1 retention size = 256MiB
    dbengine tier 1 retention time = 3mo

# Keep ordinary health alerts, but avoid ML training on the 2 GB VPS.
[ml]
    enabled = no
