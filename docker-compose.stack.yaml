version: "3.9"

services:
  traefik:
    image: traefik:v3.7.17@sha256:68ae5fe5b64ca166704b746a9e8afcd385e36b3f569a5691401bf652d57b3748
    environment:
      - DOCKER_API_VERSION=1.41
      - ACME_EMAIL=${ACME_EMAIL}
    command:
      - "--providers.swarm=true" 
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.swarm.network=portfolio_network" 

      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entryPoints.websecure.address=:443"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.50", pids: 128}
      update_config:
        failure_action: rollback
        monitor: 30s
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    networks:
      - portfolio_network
      - docker_control
      - bulkbets_ingress
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - letsencrypt:/letsencrypt

  docker-socket-proxy:
    image: haproxy:3.4.7-alpine@sha256:2caaf8b1a1ef67f3f1ea9b721f2821675d3ba4500fb518e23884fecb93e8dbaa
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    configs:
      - source: docker_proxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_control]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {memory: 64M, cpus: "0.25", pids: 64}
      restart_policy:
        condition: any

  postgres:
    # Existing data volume belongs to UID 999.
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: ghcr.io/perrysmithmoss/perry-infra-postgres@sha256:99a844ae84b960c15e29a8d5e85c1a56b9d451a5d5a7be98e79e923f03d1ec0b
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/bulkbets_db_cert, -c, ssl_key_file=/run/secrets/bulkbets_db_key, -c, hba_file=/etc/postgresql/pg_hba.conf]
    configs:
      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf
    secrets:
      - source: bulkbets_db_key
        uid: "999"
        gid: "999"
        mode: 0400
      - bulkbets_db_cert
      - postgres_user
      - source: postgres_password_v2
        target: postgres_password
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {memory: 640M, cpus: "1.0", pids: 256}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    networks:
      - portfolio_network
      - bulkbets_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: tmpfs
        target: /var/run/postgresql
        tmpfs: {size: 16777216, mode: 01777}
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 67108864, mode: 01777}

volumes:
  postgres_data:
  letsencrypt:

networks:
  bulkbets_ingress:
    external: true
  bulkbets_database:
    external: true
  docker_control:
    driver: overlay
    internal: true
  portfolio_network:
    driver: overlay
    external: true

configs:
  docker_proxy:
    file: ./docker-proxy/haproxy.cfg
  postgres_hba:
    file: ./postgres/pg_hba.conf

secrets:
  bulkbets_db_key:
    external: true
  bulkbets_db_cert:
    external: true
  postgres_user:
    external: true
  postgres_password_v2:
    external: true
