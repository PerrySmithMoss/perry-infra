version: "3.9"

services:
  traefik:
    image: traefik:v3.6.13@sha256:34d5089d0b414945342848518b383f11f5b3a645504ed87b77ffeb9d683d0e48
    environment:
      - DOCKER_API_VERSION=1.41
      - ACME_EMAIL=${ACME_EMAIL}
    command:
      - "--providers.swarm=true" 
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.swarm.network=portfolio_network" 

      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entryPoints.websecure.address=:443"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.50", pids: 128}
      update_config:
        failure_action: rollback
        monitor: 30s
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    networks:
      - portfolio_network
      - docker_control
      - bulkbets_ingress
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - letsencrypt:/letsencrypt

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      SERVICES: "1"
      TASKS: "1"
      NETWORKS: "1"
      NODES: "1"
      POST: "0"
      CONTAINERS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      EVENTS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_control]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {memory: 64M, cpus: "0.25", pids: 64}
      restart_policy:
        condition: any

  postgres:
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/bulkbets_db_cert, -c, ssl_key_file=/run/secrets/bulkbets_db_key, -c, hba_file=/etc/postgresql/pg_hba.conf]
    configs:
      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf
    secrets:
      - source: bulkbets_db_key
        uid: "999"
        gid: "999"
        mode: 0400
      - bulkbets_db_cert
      - postgres_user
      - postgres_password
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    networks:
      - portfolio_network
      - bulkbets_database
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  letsencrypt:

networks:
  bulkbets_ingress:
    external: true
  bulkbets_database:
    external: true
  docker_control:
    driver: overlay
    internal: true
  portfolio_network:
    driver: overlay
    external: true

configs:
  postgres_hba:
    file: ./postgres/pg_hba.conf

secrets:
  bulkbets_db_key:
    external: true
  bulkbets_db_cert:
    external: true
  postgres_user:
    external: true
  postgres_password:
    external: true
