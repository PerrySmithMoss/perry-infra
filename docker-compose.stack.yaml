version: "3.9"

services:
  traefik:
    image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    environment:
      - DOCKER_API_VERSION=1.41
      - ACME_EMAIL=${ACME_EMAIL}
    command:
      - "--providers.swarm=true" 
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.swarm.network=portfolio_network" 

      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entryPoints.websecure.address=:443"

      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.50", pids: 128}
      update_config:
        failure_action: rollback
        monitor: 30s
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    networks:
      - portfolio_network
      - docker_control
      - bulkbets_ingress
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    volumes:
      - letsencrypt:/letsencrypt

  docker-socket-proxy:
    image: haproxy:3.4.7-alpine@sha256:2caaf8b1a1ef67f3f1ea9b721f2821675d3ba4500fb518e23884fecb93e8dbaa
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    configs:
      - source: docker_proxy
        target: /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_control]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {memory: 64M, cpus: "0.25", pids: 64}
      restart_policy:
        condition: any

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    user: "999:1000"
    command: [redis-server, /etc/redis/redis.conf]
    configs:
      - {source: redis_shared_v1, target: /etc/redis/redis.conf}
    secrets:
      - {source: redis_users_v1, target: redis_users, uid: "999", gid: "1000", mode: 0400}
      - {source: redis_healthcheck_password_v1, target: redis_healthcheck_password, uid: "999", gid: "1000", mode: 0400}
    networks: [redis_clients]
    volumes:
      - redis_data:/data
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_healthcheck_password) redis-cli --user healthcheck ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {memory: 192M, cpus: "0.25", pids: 64}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s

  postgres:
    # Existing data volume belongs to UID 999.
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: ghcr.io/perrysmithmoss/perry-infra-postgres@sha256:6d79cb70e411a80ec759a5778b76c24ab7a0b9a5f97ab125acef24ef77e76f12
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/bulkbets_db_cert, -c, ssl_key_file=/run/secrets/bulkbets_db_key, -c, hba_file=/etc/postgresql/pg_hba.conf]
    configs:
      - source: postgres_hba
        target: /etc/postgresql/pg_hba.conf
    secrets:
      - source: bulkbets_db_key
        uid: "999"
        gid: "999"
        mode: 0400
      - bulkbets_db_cert
      - postgres_user
      - source: postgres_password_v2
        target: postgres_password
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {memory: 640M, cpus: "1.0", pids: 256}
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
    networks:
      - portfolio_network
      - bulkbets_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: tmpfs
        target: /var/run/postgresql
        tmpfs: {size: 16777216, mode: 01777}
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 67108864, mode: 01777}

volumes:
  redis_data:
    # Adopt the existing physical volume. Never run the old and new servers
    # together, and never remove this volume during stack cleanup.
    external: true
    name: im-listening_redis-data
  postgres_data:
  letsencrypt:

networks:
  redis_clients:
    external: true
  bulkbets_ingress:
    external: true
  bulkbets_database:
    external: true
  docker_control:
    driver: overlay
    internal: true
  portfolio_network:
    driver: overlay
    external: true

configs:
  redis_shared_v1:
    file: ./redis/redis.conf
  docker_proxy:
    file: ./docker-proxy/haproxy.cfg
  postgres_hba:
    file: ./postgres/pg_hba.conf

secrets:
  redis_users_v1:
    external: true
  redis_healthcheck_password_v1:
    external: true
  bulkbets_db_key:
    external: true
  bulkbets_db_cert:
    external: true
  postgres_user:
    external: true
  postgres_password_v2:
    external: true
